<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yashu Bisht | Developer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0f0f13;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* HD Anime Background with Blur */
        .bg-image {
            position: absolute;
            top: -5%; left: -5%;
            width: 110%; height: 110%;
            background-image: url('https://i.pinimg.com/originals/a4/82/35/a48235882bf610cd51ba3e1e07b8cdba.gif'); /* Premium Anime Scenery GIF */
            background-size: cover;
            background-position: center;
            filter: blur(8px) brightness(0.35);
            z-index: 1;
        }

        /* Interactive Canvas */
        #particles-js {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
        }

        /* Centered Profile Card */
        .profile-card {
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            padding: 40px 30px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            z-index: 10;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            animation: floatUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(40px);
        }

        /* Profile Picture */
        .pfp-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
        }

        .pfp {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        /* Status Dot */
        .status {
            position: absolute;
            bottom: 5px; right: 5px;
            width: 15px; height: 15px;
            background-color: #23a559; /* Discord Green */
            border-radius: 50%;
            border: 2px solid #1a1a24;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #a0a0b0;
            margin-bottom: 25px;
            font-weight: 300;
        }

        /* Smooth Pill Buttons */
        .link-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .btn {
            display: block;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 14px 20px;
            border-radius: 15px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Special Details */
        .lifeline {
            font-size: 0.85rem;
            color: #ff4d6d;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .quote {
            font-size: 0.75rem;
            color: #707080;
            font-style: italic;
            line-height: 1.6;
        }

        @keyframes floatUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>
    <div id="particles-js"></div>

    <div class="profile-card">
        <div class="pfp-container">
            <img src="https://i.pinimg.com/736x/5c/7b/16/5c7b163aeb1a60155700cbcefa8581ee.jpg" alt="Yashu Bisht" class="pfp">
            <div class="status"></div>
        </div>

        <h1>Yashu Bisht</h1>
        <div class="subtitle">Uttarakhand ➔ Delhi | Coder & API Dev</div>

        <div class="link-container">
            <a href="#" class="btn">Telegram Bot Projects</a>
            <a href="#" class="btn">Details Finder Target</a>
            <a href="#" class="btn">Random Website Creator</a>
        </div>

        <div class="lifeline">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#ff4d6d"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            Unishtha
        </div>

        <div class="quote">
            "This isn't my first website; it's the start of my success.<br>See the more, and you regret tomorrow."
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 60, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#ffffff" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.3, "random": true },
                "size": { "value": 3, "random": true },
                "line_linked": { "enable": true, "distance": 150, "color": "#ffffff", "opacity": 0.1, "width": 1 },
                "move": { "enable": true, "speed": 1.5, "direction": "none", "random": true, "straight": false, "out_mode": "out", "bounce": false }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": {
                    "onhover": { "enable": true, "mode": "grab" },
                    "onclick": { "enable": true, "mode": "push" },
                    "resize": true
                },
                "modes": {
                    "grab": { "distance": 140, "line_linked": { "opacity": 0.5 } },
                    "push": { "particles_nb": 4 }
                }
            },
            "retina_detect": true
        });
    </script>
</body>
</html>

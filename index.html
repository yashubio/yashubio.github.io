<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yashu Bisht | Developer</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600&family=Lora:ital@1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Calm, soft dark base color */
            background-color: #1a1a24;
            color: #f0f0f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;
        }

        /* Gentle, slow-moving anime clouds background */
        .bg-image {
            position: absolute;
            top: -5%; left: -5%;
            width: 110%; height: 110%;
            background-image: url('https://i.pinimg.com/originals/52/63/05/526305a4ec5170d100d021c3b6dd5ecb.gif'); /* Peaceful Ghibli Clouds */
            background-size: cover;
            background-position: center;
            filter: blur(8px) brightness(0.6);
            z-index: 1;
        }

        /* Soft Frost Glass Card */
        .profile-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 45px 35px;
            width: 90vw;
            max-width: 400px;
            text-align: center;
            z-index: 10;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            /* Very slow, calming floating animation */
            animation: fadeIn 1.5s ease-out forwards, gentleFloat 6s ease-in-out infinite alternate;
            opacity: 0;
        }

        /* Profile Picture */
        .pfp-container {
            position: relative;
            width: 105px; height: 105px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 4px;
            /* Soft pastel gradient border */
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            box-shadow: 0 0 20px rgba(254, 214, 227, 0.3);
        }

        .pfp {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffffff;
        }

        /* Calm Status Dot */
        .status {
            position: absolute;
            bottom: 4px; right: 4px;
            width: 16px; height: 16px;
            background-color: #8edc9d; /* Soft sage green */
            border-radius: 50%;
            border: 2px solid #ffffff;
            animation: softPulse 3s infinite;
        }

        h1 { 
            font-size: 1.7rem; 
            font-weight: 600; 
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        
        .subtitle { 
            font-size: 0.85rem; 
            color: #d1d1e0; 
            margin-bottom: 25px; 
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* Social Icons - Clean and Minimal */
        .social-icons { 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            margin-bottom: 25px; 
        }
        
        .social-btn {
            color: #ffffff;
            font-size: 1.3rem;
            text-decoration: none;
            opacity: 0.7;
            transition: all 0.4s ease;
        }

        .social-btn:hover {
            opacity: 1;
            transform: translateY(-3px);
            /* Soft glow based on the brand, but very muted */
            text-shadow: 0 5px 15px rgba(255,255,255,0.4);
        }

        /* Clean Pill Buttons */
        .link-container { 
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
            margin-bottom: 30px; 
        }
        
        .btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 16px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.4s ease;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        /* Lifeline & Quote */
        .lifeline { 
            font-size: 0.9rem; 
            color: #fed6e3; /* Soft pink */
            font-weight: 500; 
            margin-bottom: 15px; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Gentle floating heart */
        .fa-heart {
            animation: gentleBeat 2s infinite alternate;
        }

        .quote {
            font-family: 'Lora', serif; /* Elegant serif font for the quote */
            font-size: 0.8rem; 
            color: #b3b3cc; 
            line-height: 1.6;
            opacity: 0.8;
        }

        /* --- CALMING ANIMATIONS --- */
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        @keyframes gentleFloat { 
            0% { transform: translateY(0); } 
            100% { transform: translateY(-8px); } 
        }
        
        @keyframes softPulse { 
            0% { box-shadow: 0 0 0 0 rgba(142, 220, 157, 0.4); } 
            70% { box-shadow: 0 0 0 8px rgba(142, 220, 157, 0); } 
            100% { box-shadow: 0 0 0 0 rgba(142, 220, 157, 0); } 
        }

        @keyframes gentleBeat {
            0% { transform: scale(1); opacity: 0.8;}
            100% { transform: scale(1.15); opacity: 1;}
        }

    </style>
</head>
<body>

    <div class="bg-image"></div>

    <div class="profile-card">
        
        <div class="pfp-container">
            <img src="https://i.pinimg.com/736x/5c/7b/16/5c7b163aeb1a60155700cbcefa8581ee.jpg" alt="Yashu Bisht" class="pfp">
            <div class="status"></div>
        </div>

        <h1>Yashu Bisht</h1>
        <div class="subtitle">Uttarakhand ➔ Delhi</div>

        <div class="social-icons">
            <a href="https://t.me/yashubisht01" target="_blank" class="social-btn"><i class="fab fa-telegram-plane"></i></a>
            <a href="https://www.instagram.com/yashubishtt/" target="_blank" class="social-btn"><i class="fab fa-instagram"></i></a>
            <a href="https://discord.com/users/yashubishtt" target="_blank" class="social-btn"><i class="fab fa-discord"></i></a>
        </div>

        <div class="link-container">
            <a href="#" class="btn"><i class="fas fa-robot" style="opacity: 0.7;"></i> Telegram Bot API</a>
            <a href="#" class="btn"><i class="fas fa-search" style="opacity: 0.7;"></i> Details Finder Tool</a>
            <a href="#" class="btn"><i class="fas fa-code" style="opacity: 0.7;"></i> Random Sites Lab</a>
        </div>

        <div class="lifeline">
            <i class="fas fa-heart"></i> Unishtha
        </div>

        <div class="quote">
            "This isn't my first website; it's the start of my success.<br>See the more, and you regret tomorrow."
        </div>
    </div>

</body>
</html>
